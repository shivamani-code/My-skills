<!doctype html><!-- Grey-box wireframe in code: structure before style. Open at 412px width. -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;font:16px/1.5 system-ui;background:#f4f4f4;color:#222}
  .s{min-height:100svh;display:grid;place-content:center;gap:12px;padding:24px;border-bottom:2px dashed #bbb;text-align:center}
  .box{background:#ddd;border:2px solid #999;border-radius:8px;padding:16px;min-height:48px}
  .tag{font:12px monospace;color:#c00}
  .cta{background:#222;color:#fff;border-radius:999px;padding:14px 28px;display:inline-block}
</style>
<!-- One <section> per screen. The tag says the job of the screen; if you can't name it, cut it. -->
<section class="s"><span class="tag">S1 HOOK: what is this? (3 s)</span><div class="box" style="height:40svh">hero film / image</div><h1>2-4 WORD PROMISE</h1></section>
<section class="s"><span class="tag">S2 PROOF: why believe it?</span><div class="box">best work / number / quote</div></section>
<section class="s"><span class="tag">S3 DETAIL: how it works (max 3 points)</span><div class="box">1</div><div class="box">2</div><div class="box">3</div></section>
<section class="s"><span class="tag">S4 ACTION: one thing to do</span><a class="cta" href="#">Primary action</a><small>secondary: email link</small></section>
